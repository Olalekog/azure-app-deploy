# CI: builds the React app, runs its vitest suite, and publishes a release-ready artifact.
# Create this as an Azure DevOps pipeline named "todoapp-frontend-build" -
# frontend-release.yml references it by that exact name.
#
# Runs strictly sequentially: Build -> Test -> PublishArtifact. PublishArtifact reuses Build's
# dist/ output rather than rebuilding, and only runs after Test passes, so a failing test blocks
# the artifact from ever being published.

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - frontend

stages:
- stage: Build
  displayName: 'Build'
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        set -euo pipefail
        npm install
        npm run build
      workingDirectory: frontend
      displayName: 'npm install && npm run build'

    - publish: frontend/dist
      artifact: frontend-dist

- stage: Test
  displayName: 'Test'
  dependsOn: Build
  jobs:
  - job: Test
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'

    - script: |
        set -euo pipefail
        npm install
        npm run test
      workingDirectory: frontend
      displayName: 'npm install && npm run test'

- stage: PublishArtifact
  displayName: 'Publish artifact'
  dependsOn: Test
  jobs:
  - job: Publish
    pool:
      vmImage: ubuntu-latest
    steps:
    - download: current
      artifact: frontend-dist

    - script: |
        set -euo pipefail
        cd "$(Pipeline.Workspace)/frontend-dist"
        zip -r "$(Build.ArtifactStagingDirectory)/latest.zip" .
      displayName: 'Zip build output'

    - publish: '$(Build.ArtifactStagingDirectory)/latest.zip'
      artifact: frontend-release
