# Shared steps: download the plan file published by the matching plan stage and apply it
# unmodified (never re-plan here - applying exactly what was reviewed is the point).
# backend.hcl is regenerated from Library variables here too, since apply runs in a fresh job/
# agent that doesn't share a filesystem with the plan job.
#
# Expects, from whichever variable groups the calling job loaded: $(azureServiceConnection),
# $(resourceGroupName), $(storageAccountName) - plus a pipeline-level $(terraformVersion)
# variable.

parameters:
  - name: environmentName
    type: string
  - name: artifactName
    type: string

steps:
  - download: current
    artifact: ${{ parameters.artifactName }}
    displayName: 'Download plan file'

  - script: |
      set -euo pipefail
      curl -fsSL "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip" -o /tmp/terraform.zip
      sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
      terraform -version
    displayName: 'Install Terraform'

  - script: |
      set -euo pipefail
      cat > infra/terraform/backend.hcl <<EOF
      resource_group_name  = "$(resourceGroupName)"
      storage_account_name = "$(storageAccountName)"
      container_name       = "tfstate"
      key                   = "todoapp-${{ parameters.environmentName }}.tfstate"
      EOF
      cp "$(Pipeline.Workspace)/${{ parameters.artifactName }}/tfplan" infra/terraform/tfplan
    displayName: 'Generate backend config and stage plan file'

  - task: AzureCLI@2
    displayName: 'terraform init && terraform apply'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: bash
      workingDirectory: infra/terraform
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        terraform init -backend-config=backend.hcl -reconfigure -input=false
        terraform apply -input=false tfplan
