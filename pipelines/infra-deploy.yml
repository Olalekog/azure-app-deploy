# CI/CD for the Terraform infrastructure itself - separate from the app build/release
# pipelines, since a Terraform apply can destroy or replace real resources and deserves its
# own review point rather than being folded into an app deploy.
#
# Structure: Plan (staging) -> Apply (staging, automatic) -> Plan (production) ->
# Apply (production, gated behind manual approval - same two-layer pattern as the app release
# pipelines: a ManualValidation backstop in YAML plus the RBAC-backed approval check on the
# "todoapp-production" Environment). Apply always applies the exact plan file published by the
# matching Plan stage - it never re-plans - so what gets approved is what gets applied.
#
# Create this as an Azure DevOps pipeline named e.g. "todoapp-infra-deploy". It reuses the
# "todoapp-staging" / "todoapp-production" variable groups, the shared Key Vault-linked
# "todoapp-azure-connection" group (see azureServiceConnection in frontend-release.yml's header),
# and the Environments already set up for the app pipelines.
#
# Additionally requires "todoapp-staging-tfvars" / "todoapp-production-tfvars" (also managed by
# infra/terraform-devops - see tfvars_groups.tf there) - these hold the input values used to
# generate infra/terraform/terraform.tfvars and backend.hcl at runtime (see
# templates/terraform-plan-steps.yml and templates/terraform-apply-steps.yml), replacing what
# used to be Secure File uploads. Kept separate from todoapp-staging/todoapp-production because
# those hold the app infra's *outputs* (read from remote state, so they can't exist until that
# infra already does), while these hold *inputs* needed to create it in the first place.
#
# Bootstrap note: unlike a setup where Terraform creates its own resource group, this stack
# deploys into a pre-existing resource group and reuses a pre-existing storage account (see
# infra/terraform/variables.tf), so there's no chicken-and-egg problem scoping the service
# connection - it can point at that resource group from the start. The one manual prerequisite
# is the "tfstate" container existing in that storage account before the first Plan stage runs:
#   az storage container create -n tfstate --account-name <existing_storage_account_name>

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - infra/terraform

variables:
  terraformVersion: '1.10.4'

stages:
- stage: PlanStaging
  displayName: 'Plan (staging)'
  jobs:
  - job: Plan
    pool:
      vmImage: ubuntu-latest
    variables:
    - group: todoapp-staging
    - group: todoapp-staging-tfvars
    - group: todoapp-azure-connection
    steps:
    - template: templates/terraform-plan-steps.yml
      parameters:
        environmentName: staging
        artifactName: staging-tfplan

- stage: ApplyStaging
  displayName: 'Apply (staging)'
  dependsOn: PlanStaging
  jobs:
  - deployment: Apply
    displayName: 'Apply (staging)'
    environment: todoapp-staging
    pool:
      vmImage: ubuntu-latest
    variables:
    - group: todoapp-staging
    - group: todoapp-staging-tfvars
    - group: todoapp-azure-connection
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/terraform-apply-steps.yml
            parameters:
              environmentName: staging
              artifactName: staging-tfplan

- stage: PlanProduction
  displayName: 'Plan (production)'
  dependsOn: ApplyStaging
  jobs:
  - job: Plan
    pool:
      vmImage: ubuntu-latest
    variables:
    - group: todoapp-production
    - group: todoapp-production-tfvars
    - group: todoapp-azure-connection
    steps:
    - template: templates/terraform-plan-steps.yml
      parameters:
        environmentName: production
        artifactName: production-tfplan

- stage: ApplyProduction
  displayName: 'Apply (production)'
  dependsOn: PlanProduction
  jobs:
  - job: WaitForApproval
    displayName: 'Manual approval to apply to production'
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 1440
      inputs:
        instructions: 'Review the PlanProduction stage logs, then approve to apply Terraform to PRODUCTION infrastructure.'

  - deployment: Apply
    displayName: 'Apply (production)'
    dependsOn: WaitForApproval
    environment: todoapp-production
    pool:
      vmImage: ubuntu-latest
    variables:
    - group: todoapp-production
    - group: todoapp-production-tfvars
    - group: todoapp-azure-connection
    strategy:
      runOnce:
        deploy:
          steps:
          - template: templates/terraform-apply-steps.yml
            parameters:
              environmentName: production
              artifactName: production-tfplan
